services:
- type: web
  name: NomadAI-backend
  env: docker
  plan: free
  rootDir: backend
  healthCheckPath: /healthz
  dockerfilePath: ./Dockerfile
  dockerContext: .
  autoDeploy: true
  envVars:
  - key: GEMINI_API_KEY
    sync: false
  - key: GEMINI_MODEL
    value: gemini-3.8-flash
  - key: SUPABASE_URL
    value: https://ggisuouanswimpvslluf.supabase.co
  - key: SUPABASE_PUBLISHABLE_KEY
    sync: false
  - key: RATE_LIMIT_STORAGE_URI
    sync: false
  - key: SMOKE_TEST_TOKEN
    sync: false
  - key: CORS_ORIGINS
    sync: false

services:
- type: web
  name: nomad-ai-backend
  env: python
  plan: free
  buildCommand: pip install -r requirements.txt
  startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
  rootDir: backend
  autoDeploy: true
  envVars:
  - key: DATABASE_URL
    value: sqlite:///./nomad_ai.db
  - key: GEMINI_API_KEY
    sync: false
  - key: GEMINI_MODEL
    value: gemini-3.8-flash
  - key: SUPABASE_URL
    value: https://ggisuouanswimpvslluf.supabase.co
  - key: SUPABASE_PUBLISHABLE_KEY
    sync: false
  - key: CORS_ORIGINS
    sync: false
